<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#87CEEB"/>
    <link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    
    <title>Welcome to My World!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <style>
        /* Custom styles for a fun, kid-friendly vibe */
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to bottom, #87CEEB, #a2d2ff);
            overflow: hidden;
            cursor: default; /* Use a default cursor */
        }

        .font-fredoka {
            font-family: 'Fredoka One', cursive;
        }

        /* Island and interactive element animations */
        #island-container {
            animation: float 6s ease-in-out infinite;
        }

        .interactive-zone {
            cursor: pointer;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .interactive-zone:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 15px rgba(255, 255, 0, 0.8));
        }
        
        .interactive-zone .tooltip {
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            transform: translate(-50%, -100%);
        }
        
        .interactive-zone:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }

        .puffy-cloud {
            position: absolute;
            animation: cloud-bob 8s ease-in-out infinite;
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.1));
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        @keyframes cloud-bob {
            0% { transform: translateX(0px); }
            50% { transform: translateX(15px); }
            100% { transform: translateX(0px); }
        }

        @keyframes cloud-drift-1 {
            0% { transform: translateX(-150%); }
            100% { transform: translateX(150%); }
        }

        @keyframes cloud-drift-2 {
            0% { transform: translateX(-180%); }
            100% { transform: translateX(120%); }
        }

        .cloud-1 {
            animation: cloud-drift-1 80s linear infinite;
        }
        .cloud-2 {
            animation: cloud-drift-2 110s linear infinite;
        }
        
        /* Modal styles */
        .modal {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
        .modal.hidden {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }
        .modal-content {
             background: rgba(255, 255, 255, 0.9);
             backdrop-filter: blur(10px);
        }

        .side-island {
            position: absolute;
            z-index: 5; /* Above clouds, below main content */
            animation: side-float 10s ease-in-out infinite;
        }

        @keyframes side-float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        
        /* Sparkle trail styles */
        .sparkle {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            animation: sparkle-fade 1s forwards;
            z-index: 9999;
        }

        @keyframes sparkle-fade {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            100% { transform: scale(0) rotate(360deg) translateY(20px); opacity: 0; }
        }

        /* --- SUPERHERO MODIFICATION --- */
        #superhero {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80px;
            /* Increased height to accommodate larger head */
            height: 120px; 
            z-index: 20;
            pointer-events: none;
            animation: fly-around 25s linear infinite;
        }

        #superhero-face {
            /* Doubled the size */
            width: 80px; 
            height: 80px;
            /* Removed border and border-radius */
            position: absolute;
            /* MODIFICATION: Adjusted position down slightly */
            top: -5px;
            left: 0;
            z-index: 2;
            object-fit: cover; 
        }

        #superhero .body {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        @keyframes fly-around {
            0% { transform: translate(-400px, -200px) rotate(-15deg) scale(0.8); }
            25% { transform: translate(400px, -150px) rotate(15deg) scale(1); }
            50% { transform: translate(350px, 200px) rotate(0deg) scale(0.9); }
            75% { transform: translate(-350px, 150px) rotate(-15deg) scale(0.8); }
            100% { transform: translate(-400px, -200px) rotate(-15deg) scale(0.8); }
        }
        /* --- END OF SUPERHERO --- */

    </style>
</head>
<body class="w-screen h-screen flex items-center justify-center relative">
    <!-- Background Clouds -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0">
        <!-- Cloud 1 -->
        <div class="absolute top-[10%] left-0 cloud-1">
            <svg width="200" height="100" viewBox="0 0 200 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="50" fill="white" fill-opacity="0.8"/>
                <circle cx="110" cy="50" r="40" fill="white" fill-opacity="0.8"/>
                <circle cx="160" cy="60" r="40" fill="white" fill-opacity="0.8"/>
            </svg>
        </div>
        <!-- Cloud 2 -->
        <div class="absolute top-[40%] left-0 cloud-2">
            <svg width="300" height="120" viewBox="0 0 300 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="70" cy="60" r="60" fill="white" fill-opacity="0.7"/>
                <circle cx="150" cy="50" r="50" fill="white" fill-opacity="0.7"/>
                <circle cx="230" cy="70" r="50" fill="white" fill-opacity="0.7"/>
            </svg>
        </div>
    </div>

    <!-- NEW: Flying Superhero Character -->
    <div id="superhero">
        <img id="superhero-face" src="images/hero-face.png" alt="Superhero Face">
        <!-- MODIFICATION: Added margin-top to push body down below the larger head -->
        <svg class="body" viewBox="0 0 80 100" style="margin-top: 40px;">
            <!-- Cape -->
            <path d="M 10 30 Q 40 10 70 30 L 60 90 Q 40 100 20 90 Z" fill="#ef4444"/>
            <!-- Body -->
            <path d="M 30 35 L 50 35 L 55 70 L 25 70 Z" fill="#3b82f6"/>
        </svg>
    </div>

    <!-- Side Floating Islands -->
    <div class="side-island hidden md:block" style="left: 10%; top: 50%; animation-duration: 12s;">
        <svg width="150" height="75" viewBox="0 0 150 75">
            <path d="M10 40 Q40 20 75 40 T140 40 L140 65 Q75 85 10 65 Z" fill="#22c55e"></path>
            <path d="M10 40 L10 65 Q75 85 140 65 L140 40 Q75 25 10 40 Z" fill="#a16207"></path>
        </svg>
    </div>
    <div class="side-island hidden md:block" style="right: 10%; top: 40%;">
        <svg width="120" height="60" viewBox="0 0 120 60">
            <path d="M10 30 Q30 15 60 30 T110 30 L110 50 Q60 65 10 50 Z" fill="#22c55e"></path>
            <path d="M10 30 L10 50 Q60 65 110 50 L110 30 Q60 20 10 30 Z" fill="#a16207"></path>
        </svg>
    </div>


    <!-- Main Content -->
    <div class="text-center z-10">
        <h1 class="text-4xl md:text-6xl text-white font-fredoka tracking-wider" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">
            Welcome to <span class="outline-none focus:ring-4 focus:ring-yellow-300 rounded-lg px-2">Matt</span>'s World!
        </h1>
        <p class="text-white text-lg mt-2" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.2);">Click on the island to explore!</p>
        
        <!-- Island Container -->
        <div id="island-container" class="relative mt-8 w-full max-w-2xl mx-auto">
            <!-- Island SVG -->
            <svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
                <!-- Island Land -->
                <path d="M50 250 Q150 200 250 250 T450 250 T650 250 T750 250 L750 350 Q650 380 550 350 T350 350 T150 380 T50 350 Z" fill="#22c55e" />
                <!-- Island Dirt -->
                <path d="M50 250 L50 350 Q150 380 250 350 T450 350 T650 350 T750 350 L750 250 Q650 220 550 250 T350 250 T150 220 T50 250 Z" fill="#a16207" />
                <path d="M50 270 L50 350 Q150 380 250 350 T450 350 T650 350 T750 350 L750 270 Q650 240 550 270 T350 270 T150 240 T50 270 Z" fill="#854d0e" />
                 <!-- Waterfall -->
                <path d="M700 250 C 710 300, 715 320, 705 355 L 745 355 C 735 320, 740 300, 750 250 Z" fill="#60a5fa" />
                <path d="M710 250 C 720 300, 725 320, 715 355 L 735 355 C 725 320, 730 300, 740 250 Z" fill="#93c5fd" opacity="0.8"/>
            </svg>

            <!-- Puffy Clouds Under Island -->
            <div class="puffy-cloud" style="left: 5%; top: 85%; animation-duration: 13s; transform: scale(0.6);">
                <svg width="100" height="50" viewBox="0 0 100 50">
                    <circle cx="25" cy="25" r="25" fill="white" fill-opacity="0.9"/>
                    <circle cx="50" cy="25" r="25" fill="white" fill-opacity="0.9"/>
                </svg>
            </div>
             <div class="puffy-cloud" style="left: 10%; top: 88%; animation-duration: 11s; transform: scale(0.7);">
                <svg width="100" height="50" viewBox="0 0 100 50">
                    <circle cx="25" cy="25" r="25" fill="white" fill-opacity="0.9"/>
                    <circle cx="50" cy="25" r="25" fill="white" fill-opacity="0.9"/>
                    <circle cx="75" cy="25" r="20" fill="white" fill-opacity="0.9"/>
                </svg>
            </div>
            <div class="puffy-cloud" style="left: 25%; top: 80%; animation-duration: 10s;">
                <svg width="100" height="50" viewBox="0 0 100 50">
                    <circle cx="25" cy="25" r="25" fill="white" fill-opacity="0.9"/>
                    <circle cx="50" cy="25" r="25" fill="white" fill-opacity="0.9"/>
                    <circle cx="75" cy="25" r="20" fill="white" fill-opacity="0.9"/>
                </svg>
            </div>
            <div class="puffy-cloud" style="left: 55%; top: 85%; animation-duration: 8s; transform: scale(0.8);">
                <svg width="100" height="50" viewBox="0 0 100 50">
                    <circle cx="25" cy="25" r="25" fill="white" fill-opacity="0.9"/>
                    <circle cx="50" cy="25" r="25" fill="white" fill-opacity="0.9"/>
                    <circle cx="75" cy="25" r="20" fill="white" fill-opacity="0.9"/>
                </svg>
            </div>
             <div class="puffy-cloud" style="left: 40%; top: 90%; animation-duration: 12s; transform: scale(0.6);">
                 <svg width="100" height="50" viewBox="0 0 100 50">
                    <circle cx="25" cy="25" r="25" fill="white" fill-opacity="0.9"/>
                    <circle cx="50" cy="25" r="25" fill="white" fill-opacity="0.9"/>
                    <circle cx="75" cy="25" r="20" fill="white" fill-opacity="0.9"/>
                </svg>
            </div>
            <div class="puffy-cloud" style="left: 75%; top: 82%; animation-duration: 9s; transform: scale(0.9);">
                <svg width="100" height="50" viewBox="0 0 100 50">
                    <circle cx="25" cy="25" r="25" fill="white" fill-opacity="0.9"/>
                    <circle cx="50" cy="25" r="25" fill="white" fill-opacity="0.9"/>
                    <circle cx="75" cy="25" r="20" fill="white" fill-opacity="0.9"/>
                </svg>
            </div>

            <!-- Interactive Zones -->
            <div class="absolute inset-0">
                <!-- Family Treehouse -->
                <div id="family" class="absolute interactive-zone" style="left: 45%; top: 20%; transform: translateX(-50%);">
                    <div class="relative">
                        <svg width="120" height="150" viewBox="0 0 120 150">
                            <rect x="30" y="70" width="60" height="80" fill="#a16207"/>
                            <polygon points="10,80 110,80 60,30" fill="#be123c"/>
                            <rect x="45" y="110" width="30" height="40" fill="#facc15"/>
                            <circle cx="60" cy="95" r="10" fill="#facc15"/>
                        </svg>
                        <span class="tooltip absolute left-1/2 top-0 bg-gray-800 text-white text-xs rounded py-1 px-2 pointer-events-none whitespace-nowrap">Our Family</span>
                    </div>
                </div>

                <!-- Nature Forest -->
                <div id="nature" class="absolute interactive-zone" style="left: 20%; top: 45%; transform: translateX(-50%);">
                     <div class="relative">
                        <svg width="100" height="100" viewBox="0 0 100 100">
                           <path d="M50 90 L20 90 A 30 30 0 0 1 50 60 A 30 30 0 0 1 80 90 Z" fill="#4ade80"/>
                           <path d="M50 70 L30 70 A 20 20 0 0 1 50 50 A 20 20 0 0 1 70 70 Z" fill="#86efac"/>
                           <rect x="45" y="60" width="10" height="30" fill="#a16207"/>
                        </svg>
                        <span class="tooltip absolute left-1/2 top-0 bg-gray-800 text-white text-xs rounded py-1 px-2 pointer-events-none whitespace-nowrap">Nature</span>
                    </div>
                </div>

                <!-- Art & Coloring Cave -->
                <div id="coloring" class="absolute interactive-zone" style="left: 70%; top: 50%; transform: translateX(-50%);">
                     <div class="relative">
                        <svg width="100" height="80" viewBox="0 0 100 80">
                            <path d="M10 70 Q 50 -20 90 70 Z" fill="#a8a29e"/>
                            <path d="M25 70 Q 50 20 75 70 Z" fill="#1f2937"/>
                        </svg>
                         <span class="tooltip absolute left-1/2 top-0 bg-gray-800 text-white text-xs rounded py-1 px-2 pointer-events-none whitespace-nowrap">Art Cave</span>
                    </div>
                </div>

                <!-- Games & iPad Arcade -->
                <div id="games" class="absolute interactive-zone" style="left: 85%; top: 35%; transform: translateX(-50%);">
                     <div class="relative">
                        <svg width="80" height="100" viewBox="0 0 80 100">
                          <rect x="0" y="0" width="80" height="100" rx="10" fill="#ef4444"/>
                          <rect x="10" y="10" width="60" height="40" fill="black"/>
                          <circle cx="25" cy="70" r="8" fill="#3b82f6"/>
                          <rect x="45" y="65" width="25" height="15" rx="5" fill="#f97316"/>
                        </svg>
                        <span class="tooltip absolute left-1/2 top-0 bg-gray-800 text-white text-xs rounded py-1 px-2 pointer-events-none whitespace-nowrap">Game Zone</span>
                    </div>
                </div>
                 <!-- Disney Castle -->
                <div id="disney" class="absolute interactive-zone" style="left: 35%; top: 35%; transform: translateX(-50%);">
                     <div class="relative">
                        <svg width="80" height="100" viewBox="0 0 80 100">
                          <rect x="20" y="50" width="40" height="50" fill="#a5b4fc"/>
                          <polygon points="10,50 70,50 40,20" fill="#818cf8"/>
                          <rect x="5" y="60" width="15" height="40" fill="#c7d2fe"/>
                          <polygon points="0,60 20,60 10,40" fill="#a5b4fc"/>
                          <rect x="60" y="60" width="15" height="40" fill="#c7d2fe"/>
                          <polygon points="55,60 75,60 65,40" fill="#a5b4fc"/>
                        </svg>
                        <span class="tooltip absolute left-1/2 top-0 bg-gray-800 text-white text-xs rounded py-1 px-2 pointer-events-none whitespace-nowrap">Magic Castle</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal Container -->
    <div id="modal-container" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 hidden">
        <div class="modal-content w-full max-w-lg bg-white rounded-2xl shadow-xl p-6 relative transform text-center">
            <button id="close-modal" class="absolute top-4 right-4 text-gray-500 hover:text-gray-800">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h2 id="modal-title" class="text-3xl font-fredoka text-gray-800 mb-4">Modal Title</h2>
            <div id="modal-body" class="text-gray-600 space-y-4">
                <!-- Content will be injected here -->
            </div>
        </div>
    </div>
    

    <script>
        const modalContainer = document.getElementById('modal-container');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        const closeModalBtn = document.getElementById('close-modal');

        // --- UNIQUE SOUND EFFECTS ---
        const synth = new Tone.Synth({
            oscillator: { type: "sine" },
            envelope: { attack: 0.005, decay: 0.1, sustain: 0.3, release: 1 }
        }).toDestination();
        
        // SYNTAX FIX: Added 'const sounds = {' to correctly define the object.
        const sounds = {
            family: "C5",
            nature: "E5",
            coloring: "G5",
            games: "A5",
            disney: "F5"
        };

        function playClickSound(note = "C5") {
            Tone.start(); 
            synth.triggerAttackRelease(note, "8n");
        }
        // --- END OF SOUND EFFECTS ---

        // Content for each zone
        const content = {
            family: {
                title: "Our Family Treehouse!",
                body: `
                    <p>This is our special place! It's all about us.</p>
                    <img src="images/my-family.jpg" class="rounded-lg mx-auto my-4 shadow-md" alt="A photo of our family">
                    <p>We can add our favorite photos and stories here.</p>
                    <a href="#" class="mt-4 inline-block bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold py-2 px-4 rounded-lg transition-colors">View Photo Album</a>
                `
            },
            nature: {
                title: "The Great Outdoors",
                body: `
                    <p>Let's explore the forest and see what we can find!</p>
                    <p class="my-4">Did you know? Some trees can live for thousands of years!</p>
                    <div class="grid grid-cols-2 gap-4">
                        <a href="https://kids.nationalgeographic.com/animals" target="_blank" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg transition-colors">Cool Animals</a>
                        <a href="https://www.pbs.org/parents/crafts-and-experiments/nature-and-outdoors" target="_blank" class="bg-blue-400 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition-colors">Nature Crafts</a>
                    </div>
                `
            },
            coloring: {
                title: "The Art Cave",
                body: `
                    <p>A place to get creative! Let's make some art.</p>
                     <img src="https://placehold.co/400x250/fecaca/333333?text=His+Awesome+Drawing" class="rounded-lg mx-auto my-4 shadow-md" alt="Placeholder for his drawing">
                    <p>We can display your best drawings right here!</p>
                    <a href="https://www.online-coloring.com/" target="_blank" class="mt-4 inline-block bg-red-400 hover:bg-red-500 text-white font-bold py-2 px-4 rounded-lg transition-colors">Online Coloring Pages</a>
                `
            },
            games: {
                title: "The Game Zone!",
                body: `
                    <p>Time for some fun and learning!</p>
                    <p class="my-4">Click the button below to play lots of cool games.</p>
                    <a href="https://pbskids.org/games" target="_blank" class="block bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition-colors text-lg">Play Educational Games</a>
                `
            },
            disney: {
                title: "The Magic Castle",
                body: `
                    <p>A place for magic, dreams, and happily ever afters!</p>
                    <img src="https://placehold.co/400x250/a5b4fc/333333?text=Disney+Magic" class="rounded-lg mx-auto my-4 shadow-md" alt="Placeholder for Disney image">
                    <p>We can put links to your favorite songs and movies here.</p>
                    <a href="https://www.disney.com/" target="_blank" class="mt-4 inline-block bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg transition-colors">Go to Disney.com</a>
                `
            },
        };

        // Function to open the modal
        function openModal(zoneId) {
            const zoneContent = content[zoneId];
            if (zoneContent) {
                modalTitle.textContent = zoneContent.title;
                modalBody.innerHTML = zoneContent.body;
                modalContainer.classList.remove('hidden');
            }
        }

        // Function to close the modal
        function closeModal() {
            modalContainer.classList.add('hidden');
        }

        // Event listeners for interactive zones
        document.querySelectorAll('.interactive-zone').forEach(zone => {
            zone.addEventListener('click', () => {
                const note = sounds[zone.id] || "C5"; 
                playClickSound(note); 
                openModal(zone.id);
            });
        });

        // Event listeners for closing the modal
        closeModalBtn.addEventListener('click', closeModal);
        modalContainer.addEventListener('click', (event) => {
            if (event.target === modalContainer) {
                closeModal();
            }
        });
        
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && !modalContainer.classList.contains('hidden')) {
                closeModal();
            }
        });
        
        // Sparkle trail script
        document.addEventListener('mousemove', function(e) {
            let sparkle = document.createElement('div');
            sparkle.classList.add('sparkle');
            
            const size = Math.random() * 10 + 5;
            sparkle.style.width = `${size}px`;
            sparkle.style.height = `${size}px`;

            sparkle.style.left = (e.pageX - size / 2) + 'px';
            sparkle.style.top = (e.pageY - size / 2) + 'px';
            
            const colors = ['#FFD700', '#FFFFFF', '#87CEEB', '#FFC0CB', '#98FB98'];
            sparkle.style.background = colors[Math.floor(Math.random() * colors.length)];
            
            document.body.appendChild(sparkle);

            setTimeout(() => {
                sparkle.remove();
            }, 1000);
        });

        // --- NEW: PWA Service Worker Registration ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => {
                        console.log('Service Worker registered! Scope: ', registration.scope);
                    })
                    .catch(err => {
                        console.log('Service Worker registration failed: ', err);
                    });
            });
        }
        // --- END OF PWA SCRIPT ---

    </script>
</body>
</html>
